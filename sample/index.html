<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교육자료 샘플 | 마이팜</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 48px 20px; color: #172033; background: #f5f7fb; }
    h1 { margin-bottom: 8px; }
    .intro { margin-top: 0; color: #526078; }
    section { margin-top: 32px; padding: 24px; border: 1px solid #dce2ec; border-radius: 16px; background: #fff; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
    a { display: block; padding: 16px; border-radius: 12px; color: #fff; background: #275efe; text-decoration: none; font-weight: 700; }
    a.secondary { color: #1f2b44; background: #e8edf6; }
    small { display: block; margin-top: 6px; font-weight: 400; opacity: .82; }
  </style>
</head>
<body>
  <main>
    <h1>교육자료 샘플</h1>
    <p class="intro">제작 전후의 차이를 직접 확인하는 교육용 결과물입니다.</p>
    <section>
      <h2>건조시럽 계산기</h2>
      <p>짧은 요청으로 만든 첫 결과와, 약사가 명세와 검증을 더한 결과를 비교합니다.</p>
      <div class="links">
        <a class="secondary" href="./dry/first/">첫 결과 열기<small>최소 입력으로 생성한 결과</small></a>
        <a href="./dry/final/">개선 결과 열기<small>지침과 검증을 반영한 결과</small></a>
      </div>
    </section>
  </main>
</body>
</html>
