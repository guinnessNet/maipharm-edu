<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마이팜 교육자료</title>
  <style>
    :root{--ink:#19352e;--accent:#0f6b50;--line:#d8e5df;--paper:#f5f8f6}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65}
    main{width:min(760px,calc(100% - 32px));margin:56px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,6vw,52px)}
    h1{margin:0 0 8px;font-size:clamp(1.9rem,5vw,2.8rem)}.lead{margin:0 0 36px;color:#52655f}
    a.card{display:block;padding:22px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none}
    a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:3px solid #cbe7dc}.card strong{display:block;color:var(--accent);font-size:1.2rem}
    footer{margin-top:34px;color:#667872;font-size:.92rem}
  </style>
</head>
<body><main>
  <h1>마이팜 교육자료</h1>
  <p class="lead">책과 강의에서 사용하는 공개 자료를 한곳에 모았습니다.</p>
  <a class="card" href="/dry">
    <strong>건조시럽 환산계수·칭량 질량 계산기</strong>
    Claude 웹에서 기본 11제품 계산기를 만드는 고정 지침 v1.1.0
  </a>
  <footer>이 사이트는 방문자의 개인정보나 입력 내용을 수집하지 않습니다.</footer>
</main></body>
</html>
